<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ch.5 表格(table)</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css" />
    <link rel="stylesheet" href="CSS/myall.css" />
    <style>
      @media screen and (max-width:768px) {
        .table-rwd thead {
          display:none;
        }
        .table-rwd tbody tr {
          display: block;
          border: 3px solid var(--border02);
          border-radius: 10px;
          margin-top: 15px;
        }
        .table-rwd tbody tr td {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="display-1 fw-900">ch.5 表格(table)</div>
      <table class="table table-striped table-bordered table-hover table-sm table-rwd">
        <caption>產品列表1.0</caption>
        <thead class="table-dark">
          <tr>
            <th>編號</th>
            <th>產品名稱</th>
            <th>產品價格</th>
            <th>產品備註</th>
          </tr>
        </thead>

        <tbody class="table-primary">
          <tr>
            <td>01</td>
            <td>木瓜牛奶</td>
            <td>$60</td>
            <td>微糖微冰</td>
          </tr>
          <tr class="table-success">
            <td>02</td>
            <td class="bg-danger">西瓜牛奶</td>
            <td class="table-danger"><del>$160</del>  特價$80</td>
            <td>半糖微冰</td>
          </tr>
          <tr>
            <td>03</td>
            <td>西西里</td>
            <td>$90</td>
            <td>無糖微冰</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
