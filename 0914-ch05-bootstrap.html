<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ch.5 表格(table)</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css" />
    <link rel="stylesheet" href="CSS/myall.css" />
  </head>
  <body>
    <div class="container">
      <div class="display-1 fw-900">ch.5 表格(table)</div>
      <table class="table table-striped table-bordered table-hover table-sm">
        <thead class="table-dark">
          <tr>
            <th>編號</th>
            <th>產品名稱</th>
            <th>產品價格</th>
            <th>產品備註</th>
          </tr>
        </thead>

        <tbody class="table-primary">
          <tr>
            <th>01</th>
            <th>木瓜牛奶</th>
            <th>$60</th>
            <th>微糖微冰</th>
          </tr>
          <tr class="table-success">
            <th>02</th>
            <th>西瓜牛奶</th>
            <th class="table-danger"><del>$160</del>  特價$80</th>
            <th>半糖微冰</th>
          </tr>
          <tr>
            <th>03</th>
            <th>西西里</th>
            <th>$90</th>
            <th>無糖微冰</th>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
